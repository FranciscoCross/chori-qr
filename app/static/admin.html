<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f1410">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<title>Chori QR · Admin</title>
<style>
  :root {
    --bg: #1f1410; --grilla: #2a1b14; --panel: #3a2418; --tinta: #0d0806;
    --texto: #f6e7c8; --suave: #d8c6a4; --tenue: #b8a585; --amarillo: #ffd23f;
    --acento: #ffb02e; --acento-sombra: #c27a12;
    --ok: #5bd16b; --ok-sombra: #2f9a3f; --ok-bg: #10331a; --ok-texto: #b9f5c1;
    --mal: #ff6b4a; --mal-bg: #3d0f0c; --mal-texto: #ffc2b5; --error: #ff8a80;
    --pixel: "Press Start 2P", ui-monospace, monospace;
    --cuerpo: "VT323", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background-color: var(--bg); color: var(--texto); font: 23px/1.3 var(--cuerpo);
    background-image: linear-gradient(var(--grilla) 2px, transparent 2px), linear-gradient(90deg, var(--grilla) 2px, transparent 2px);
    background-size: 24px 24px; -webkit-font-smoothing: none; }
  h1, h2, h3 { font-family: var(--pixel); font-weight: 400; line-height: 1.6; }
  h1 { font-size: 15px; color: var(--amarillo); text-shadow: 2px 2px 0 #000; display: flex; align-items: center; gap: 12px; }
  .ico { flex: none; image-rendering: pixelated; vertical-align: middle; }
  .oculto { display: none !important; }
  label { display: block; font-family: var(--pixel); font-size: 10px; color: var(--amarillo); margin-bottom: 8px; }
  input { font: 26px var(--cuerpo); width: 100%; padding: 12px; border: 4px solid var(--tinta); border-radius: 0;
    background: var(--bg); color: var(--texto); box-shadow: inset 4px 4px 0 #120b08; outline: none; margin-bottom: 14px; }
  input:focus { border-color: var(--acento); }
  input::placeholder { color: #8f7a5c; }
  button { font: 11px/1.6 var(--pixel); text-transform: uppercase; width: 100%; padding: 14px 10px; cursor: pointer;
    border: 4px solid var(--tinta); border-radius: 0; background: var(--panel); color: var(--texto);
    box-shadow: inset -4px -4px 0 rgba(0,0,0,.35), 4px 4px 0 var(--tinta); }
  button:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: inset -4px -4px 0 rgba(0,0,0,.35), 2px 2px 0 var(--tinta); }
  button.primario { background: var(--acento); color: var(--bg); box-shadow: inset -4px -4px 0 var(--acento-sombra), 4px 4px 0 var(--tinta); }
  button.link, button.secundario, button.peligro { background: none; border: 0; box-shadow: none; width: auto;
    font-size: 9px; color: var(--tenue); text-decoration: underline; text-underline-offset: 4px; padding: 12px 4px; }
  button.peligro { color: var(--error); }
  button:disabled { opacity: .45; cursor: not-allowed; box-shadow: inset -4px -4px 0 rgba(0,0,0,.35); }
  .error { color: var(--error); min-height: 1.4em; margin: 0 0 10px; }

  main { max-width: 640px; margin: 0 auto; padding: 20px 20px calc(28px + env(safe-area-inset-bottom)); }
  h1 { margin: 0 0 16px; font-size: 14px; }
  h2 { font-size: 11px; margin: 0 0 14px; color: var(--amarillo); }
  #v-pin form, .formulario { background: var(--panel); border: 4px solid var(--tinta); box-shadow: 6px 6px 0 var(--tinta); padding: 18px; }
  .aviso { color: var(--ok-texto); min-height: 1.4em; margin: 0 0 10px; }
  .totales { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
  .totales div { background: var(--panel); border: 4px solid var(--tinta); box-shadow: 4px 4px 0 var(--tinta); padding: 12px 6px; text-align: center; }
  .totales b { display: block; font: 20px/1.4 var(--pixel); color: var(--acento); margin-bottom: 6px; }
  .totales span { font-size: 20px; color: var(--suave); }
  .barra { display: flex; gap: 10px; align-items: stretch; margin-bottom: 10px; }
  .barra input { margin: 0; flex: 1; min-width: 0; }
  .barra button { width: auto; white-space: nowrap; }
  .filtro { display: flex; gap: 8px; align-items: center; font: 21px var(--cuerpo); color: var(--tenue); margin-bottom: 12px; }
  .filtro input { width: 20px; height: 20px; margin: 0; accent-color: var(--acento); box-shadow: none; }
  .lista { display: flex; flex-direction: column; gap: 8px; }
  .fila { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left;
    background: var(--panel); border: 4px solid var(--tinta); box-shadow: none; padding: 10px 12px;
    font: 24px var(--cuerpo); text-transform: none; color: var(--texto); }
  .fila:hover { border-color: var(--acento); }
  .fila .nom { color: var(--texto); }
  .fila .det { font-size: 20px; color: var(--tenue); }
  .fila .saldo { font: 13px var(--pixel); white-space: nowrap; }
  .chip { display: inline-block; font: 8px/1 var(--pixel); text-transform: uppercase; padding: 5px 6px; margin-left: 6px; border: 2px solid; }
  .chip.falta { background: var(--mal-bg); color: var(--mal-texto); border-color: var(--mal); margin-left: 0; }
  .chip.clave { background: var(--ok-bg); color: var(--ok-texto); border-color: var(--ok); }
  .formulario { margin-bottom: 18px; border-color: var(--acento); }
  .grupo { display: grid; grid-template-columns: 1fr 120px; gap: 12px; }
  .acciones { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
  .acciones .primario { flex: 1; }
  .acciones button:not(.primario):not(.link):not(.peligro) { width: auto; }
  .info { font-size: 21px; color: var(--tenue); margin: 0 0 10px; }
  .bloqueos { background: var(--mal-bg); border: 4px solid var(--mal); box-shadow: 4px 4px 0 var(--tinta); padding: 12px; margin-bottom: 18px; }
  .bloqueos h2 { font-size: 10px; color: var(--mal-texto); display: flex; align-items: center; gap: 10px; }
  .bloqueo { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 4px dotted #5c1f18; }
  .bloqueo:first-of-type { border-top: 0; }
  .bloqueo .det { font-size: 20px; color: #e9b8ad; }
  .bloqueo button { width: auto; font-size: 8px; padding: 12px 8px; white-space: nowrap; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .comprobantes { background: var(--panel); border: 4px solid var(--amarillo); box-shadow: 4px 4px 0 var(--tinta); padding: 12px; margin-bottom: 18px; }
  .comprobantes h2 { font-size: 10px; color: var(--amarillo); }
  .cp { border-top: 4px dotted #5a3a26; padding: 12px 0; display: flex; flex-direction: column; gap: 8px; }
  .cp:first-of-type { border-top: 0; }
  .cp .quien { font-size: 24px; }
  .cp .det { color: var(--tenue); font-size: 20px; }
  .cp a.ver { display: block; border: 4px solid var(--tinta); background: var(--bg); }
  .cp img { display: block; width: 100%; max-height: 420px; object-fit: contain; image-rendering: auto; }
  .cp a.archivo { font: 10px/1.6 var(--pixel); color: var(--acento); padding: 12px; display: inline-block; }
  .cp .linea { display: flex; gap: 10px; align-items: stretch; }
  .cp .linea input { margin: 0; flex: 0 0 90px; text-align: center; }
  .cp .linea button { flex: 1; }
  .cp .dup { font: 9px/1.8 var(--pixel); color: var(--mal-texto); background: var(--mal-bg); border: 3px solid var(--mal);
    padding: 6px 8px; text-transform: uppercase; }
  .registro { background: var(--panel); border: 4px solid var(--tinta); box-shadow: 6px 6px 0 var(--tinta); margin-top: 24px; }
  .registro summary { font: 11px/1.6 var(--pixel); color: var(--amarillo); padding: 16px 14px; cursor: pointer; list-style: none; }
  .registro summary::-webkit-details-marker { display: none; }
  .registro summary::before { content: "+ "; }
  .registro[open] summary::before { content: "- "; }
  .registro .cuerpo { padding: 0 14px 14px; }
  .registro .barra select { font: 22px var(--cuerpo); background: var(--bg); color: var(--texto); border: 4px solid var(--tinta);
    padding: 8px; border-radius: 0; }
  .ev { border-top: 4px dotted #5a3a26; padding: 10px 0; display: flex; flex-direction: column; gap: 2px; }
  .ev:first-child { border-top: 0; }
  .ev .arriba { display: flex; justify-content: space-between; gap: 8px; color: var(--tenue); font-size: 20px; }
  .ev .quien { font-size: 22px; }
  .ev .res { font-size: 21px; }
  .ev .res.bien { color: var(--ok-texto); }
  .ev .res.mal { color: var(--mal-texto); }
  .ev .tipo { font: 9px/1.8 var(--pixel); color: var(--amarillo); text-transform: uppercase; }
  .totales.caja { grid-template-columns: 1fr; gap: 8px; }
  .totales.caja div { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; text-align: left; }
  .totales.caja b { order: 2; font-size: 14px; margin: 0; }
  .totales.caja span { order: 1; }
  .totales.caja .saldo-ok b { color: var(--ok); }
  .totales.caja .saldo-mal b { color: var(--mal); }
  .costo { border-top: 4px dotted #5a3a26; padding-top: 14px; margin-bottom: 8px; }
  .por-persona summary { font: 9px/1.6 var(--pixel); color: var(--acento); padding: 10px 0; cursor: pointer; }
  .ev .dif { font-size: 21px; }
  .ev .dif.bien { color: var(--ok-texto); }
  .ev .dif.mal { color: var(--mal-texto); }
  .gasto-form { border-top: 4px dotted #5a3a26; padding-top: 14px; margin-bottom: 8px; }
  .gasto-form input[type=file] { font-size: 20px; padding: 8px; }
  .ev .monto { font: 12px/1.6 var(--pixel); color: var(--acento); white-space: nowrap; }
  .ev .ops { display: flex; gap: 0 6px; flex-wrap: wrap; align-items: center; }
  .ev .ops button { white-space: nowrap; }
  .ev .ops a { font: 9px/1.6 var(--pixel); color: var(--acento); padding: 12px 4px; }
</style>
</head>
<body>
<main>
  <h1><svg class="ico" width="40" height="20" viewBox="0 0 16 8" shape-rendering="crispEdges" aria-hidden="true"><rect x="1" y="4" width="14" height="3" fill="#d9a05b"/><rect x="0" y="5" width="1" height="2" fill="#8a5a2b"/><rect x="15" y="5" width="1" height="2" fill="#8a5a2b"/><rect x="1" y="7" width="14" height="1" fill="#8a5a2b"/><rect x="2" y="2" width="12" height="3" fill="#b8432f"/><rect x="1" y="3" width="1" height="1" fill="#b8432f"/><rect x="14" y="3" width="1" height="1" fill="#b8432f"/><rect x="3" y="2" width="9" height="1" fill="#e0704f"/><rect x="3" y="3" width="2" height="1" fill="#ffd23f"/><rect x="7" y="3" width="2" height="1" fill="#ffd23f"/><rect x="11" y="3" width="2" height="1" fill="#ffd23f"/></svg> ADMIN</h1>

  <section id="v-pin" class="oculto">
    <form id="f-pin">
      <label for="pin">PIN de administración</label>
      <input id="pin" type="password" autocomplete="off" required>
      <p class="error" id="e-pin"></p>
      <button class="primario">Ingresar</button>
    </form>
  </section>

  <section id="v-panel" class="oculto">
    <div class="totales">
      <div><b id="t-personas">0</b><span>personas</span></div>
      <div><b id="t-vendidos">0</b><span>choris</span></div>
      <div><b id="t-entregados">0</b><span>entregados</span></div>
    </div>

    <form id="f-persona" class="formulario oculto" autocomplete="off">
      <h2 id="f-titulo">Nueva persona</h2>
      <label for="f-nombre">Nombre y apellido</label>
      <input id="f-nombre" required maxlength="80">
      <div class="grupo">
        <div>
          <label for="f-dni">DNI (sin puntos)</label>
          <input id="f-dni" inputmode="numeric" maxlength="10" placeholder="Opcional">
        </div>
        <div>
          <label for="f-total">Choris</label>
          <input id="f-total" type="number" inputmode="numeric" min="0" max="100" required>
        </div>
      </div>
      <p class="info" id="f-info"></p>
      <p class="error" id="e-form"></p>
      <div class="acciones">
        <button class="primario" id="b-guardar">Guardar</button>
        <button type="button" id="b-cancelar">Cancelar</button>
      </div>
      <div class="acciones" id="acciones-extra">
        <button type="button" class="link" id="b-reset">Resetear contraseña</button>
        <button type="button" class="link" id="b-ver-registro">Ver registro</button>
        <button type="button" class="peligro" id="b-borrar">Borrar persona</button>
      </div>
    </form>

    <section id="comprobantes" class="comprobantes oculto">
      <h2>Comprobantes pendientes (<span id="n-comp">0</span>)</h2>
      <div id="lista-comprobantes"></div>
    </section>

    <section id="bloqueos" class="bloqueos oculto">
      <h2><svg class="ico" width="20" height="20" viewBox="0 0 8 8" shape-rendering="crispEdges" aria-hidden="true" fill="#ffc2b5"><rect x="2" y="0" width="4" height="1"/><rect x="1" y="1" width="1" height="3"/><rect x="6" y="1" width="1" height="3"/><rect x="0" y="3" width="8" height="5"/><rect x="3" y="5" width="2" height="2" fill="#3d0f0c"/></svg>Bloqueados por intentos fallidos</h2>
      <div id="lista-bloqueos"></div>
    </section>

    <p class="aviso" id="aviso"></p>
    <div class="barra">
      <input id="buscar" placeholder="Buscar por nombre o DNI" autocomplete="off">
      <button class="primario" id="b-nueva">+ Agregar</button>
    </div>
    <label class="filtro"><input type="checkbox" id="solo-sin-dni"> Mostrar solo personas sin DNI</label>
    <div class="lista" id="lista"></div>

    <details class="registro" id="caja">
      <summary>Caja: recaudado y gastos</summary>
      <div class="cuerpo">
        <div class="totales caja">
          <div><b id="k-recaudado">$0</b><span>recaudado</span></div>
          <div><b id="k-gastado">$0</b><span>gastos</span></div>
          <div id="k-saldo-caja"><b id="k-saldo">$0</b><span>queda</span></div>
        </div>
        <p class="info" id="k-info"></p>
        <div class="costo">
          <div class="totales caja">
            <div id="k-costo-caja"><b id="k-costo">-</b><span>costo real por chori</span></div>
          </div>
          <p class="info" id="k-costo-info"></p>
          <details class="por-persona" id="k-detalle">
            <summary>Cuánto debería pagar cada uno</summary>
            <p class="info" id="k-pp-info"></p>
            <div id="l-por-persona"></div>
          </details>
        </div>
        <form id="f-gasto" class="gasto-form" autocomplete="off">
          <label for="g-desc">Nuevo gasto</label>
          <input id="g-desc" required maxlength="120" placeholder="Ej.: 10 kg de carbón">
          <div class="grupo">
            <div>
              <label for="g-pago">Pagó (opcional)</label>
              <input id="g-pago" maxlength="80" placeholder="Quién lo pagó">
            </div>
            <div>
              <label for="g-monto">Monto $</label>
              <input id="g-monto" type="number" inputmode="numeric" min="1" step="1" required>
            </div>
          </div>
          <label for="g-ticket">Ticket (opcional)</label>
          <input id="g-ticket" type="file" accept="image/*,application/pdf">
          <p class="error" id="e-gasto"></p>
          <button class="primario" id="b-gasto">Agregar gasto</button>
        </form>
        <div id="l-gastos"></div>
        <input id="g-adjuntar" type="file" accept="image/*,application/pdf" class="oculto">
      </div>
    </details>

    <details class="registro" id="entregas">
      <summary>Entregas</summary>
      <div class="cuerpo">
        <div class="barra">
          <label for="en-texto" class="sr">Filtrar por nombre o DNI</label>
          <input id="en-texto" placeholder="Nombre o DNI" autocomplete="off">
        </div>
        <p class="info" id="en-info"></p>
        <div id="l-entregas"></div>
      </div>
    </details>

    <details class="registro" id="registro">
      <summary>Registro de accesos</summary>
      <div class="cuerpo">
        <div class="barra">
          <label for="r-dni" class="sr">Filtrar por DNI</label>
          <input id="r-dni" inputmode="numeric" placeholder="DNI" autocomplete="off">
          <label for="r-tipo" class="sr">Tipo de evento</label>
          <select id="r-tipo">
            <option value="todos">Todos</option>
            <option value="fallos">Solo fallos</option>
            <option value="claves">Contraseñas</option>
            <option value="admin">PIN y admin</option>
          </select>
        </div>
        <p class="info" id="r-info"></p>
        <div id="l-registro"></div>
      </div>
    </details>
    <p><button class="link" id="b-salir">Salir</button></p>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let personas = [];
let enOferta = 0;  // choris donados que todavía nadie tomó
let editando = null;  // persona en edición, o null si es nueva

async function api(ruta, datos = {}) {
  const r = await fetch(ruta, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datos),
  });
  const cuerpo = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(cuerpo.error || "Error de conexión"); e.estado = r.status; throw e; }
  return cuerpo;
}

function mostrar(vista) {
  $("v-pin").classList.toggle("oculto", vista !== "pin");
  $("v-panel").classList.toggle("oculto", vista !== "panel");
}

function avisar(texto) {
  $("aviso").textContent = texto;
  clearTimeout(avisar.t);
  avisar.t = setTimeout(() => { $("aviso").textContent = ""; }, 4000);
}

function formatoDni(dni) {
  return dni ? Number(dni).toLocaleString("es-AR") : "";
}

async function cargar() {
  try {
    ({ personas, en_oferta: enOferta } = await api("/api/admin/personas"));
    mostrar("panel");
    pintar();
    await Promise.all([cargarBloqueos(), cargarComprobantes()]);
  } catch (e) {
    if (e.estado === 401) mostrar("pin"); else avisar(e.message);
  }
}

function pintar() {
  $("t-personas").textContent = personas.length;
  $("t-vendidos").textContent = personas.reduce((a, p) => a + p.total, 0) + enOferta;
  $("t-entregados").textContent = personas.reduce((a, p) => a + p.total - p.restantes, 0);

  const q = $("buscar").value.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  const qDigitos = q.replace(/\D/g, "");
  const soloSinDni = $("solo-sin-dni").checked;
  const lista = $("lista");
  lista.innerHTML = "";
  const visibles = personas.filter((p) => {
    if (soloSinDni && p.dni) return false;
    if (!q) return true;
    const nombre = p.nombre.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    return nombre.includes(q) || (qDigitos && (p.dni || "").includes(qDigitos));
  });
  if (!visibles.length) lista.innerHTML = `<p class="info">Sin resultados.</p>`;
  for (const p of visibles) {
    const b = document.createElement("button");
    b.className = "fila";
    const izq = document.createElement("div");
    const nom = document.createElement("div");
    nom.className = "nom";
    nom.textContent = p.nombre;
    const det = document.createElement("div");
    det.className = "det";
    det.innerHTML = p.dni
      ? `DNI ${formatoDni(p.dni)}${p.tiene_clave ? '<span class="chip clave">ingresó</span>' : ""}`
      : `<span class="chip falta">falta DNI</span>`;
    izq.append(nom, det);
    const saldo = document.createElement("div");
    saldo.className = "saldo";
    saldo.textContent = `${p.restantes}/${p.total}`;
    b.append(izq, saldo);
    b.onclick = () => abrirFormulario(p);
    lista.appendChild(b);
  }
}

async function cargarComprobantes() {
  const { comprobantes, precio } = await api("/api/admin/comprobantes");
  $("comprobantes").classList.toggle("oculto", !comprobantes.length);
  $("n-comp").textContent = comprobantes.length;
  const lista = $("lista-comprobantes");
  // No repintar si nada cambió: no pisar una cantidad que el admin está editando.
  const firma = comprobantes.map((c) => c.id).join(",");
  if (lista.dataset.firma === firma) return;
  lista.dataset.firma = firma;
  lista.innerHTML = "";
  for (const c of comprobantes) {
    const caja = document.createElement("div");
    caja.className = "cp";
    const quien = document.createElement("div");
    quien.className = "quien";
    quien.textContent = `${c.nombre} · DNI ${formatoDni(c.dni)}`;
    const det = document.createElement("div");
    det.className = "det";
    det.textContent = `#${c.id} · ${c.fecha} · dice que pagó ${c.pedida} chori${c.pedida === 1 ? "" : "s"} `
      + `($${(c.pedida * precio).toLocaleString("es-AR")}) · hoy tiene ${c.total_actual}`;
    const url = `/api/admin/comprobante/${c.id}`;
    let vista;
    if (/^image\/(jpeg|png|webp)$/.test(c.tipo)) {
      vista = document.createElement("a");
      vista.className = "ver";
      vista.href = url;
      vista.target = "_blank";
      vista.rel = "noopener";
      const img = document.createElement("img");
      img.src = url;
      img.alt = `Comprobante de ${c.nombre}`;
      img.loading = "lazy";
      vista.appendChild(img);
    } else {
      vista = document.createElement("a");
      vista.className = "archivo";
      vista.href = url;
      vista.target = "_blank";
      vista.rel = "noopener";
      vista.textContent = c.tipo === "application/pdf" ? "Abrir PDF" : "Descargar foto (HEIC)";
    }
    const linea = document.createElement("div");
    linea.className = "linea";
    const cant = document.createElement("input");
    cant.type = "number";
    cant.min = "1";
    cant.max = "50";
    cant.value = c.pedida;
    cant.setAttribute("aria-label", "Choris a acreditar");
    const aprobar = document.createElement("button");
    aprobar.className = "primario";
    aprobar.textContent = "Aprobar";
    aprobar.onclick = () => resolverComprobante(c, true, Number(cant.value));
    const rechazar = document.createElement("button");
    rechazar.textContent = "Rechazar";
    rechazar.onclick = () => resolverComprobante(c, false, 0, c.duplicado_de ? "Comprobante duplicado" : undefined);
    linea.append(cant, aprobar, rechazar);
    caja.append(quien, det);
    if (c.duplicado_de) {
      const dup = document.createElement("div");
      dup.className = "dup";
      dup.textContent = `Duplicado: es el mismo archivo que el comprobante #${c.duplicado_de}`;
      caja.appendChild(dup);
    }
    caja.append(vista, linea);
    lista.appendChild(caja);
  }
}

async function resolverComprobante(c, aprobar, cantidad, motivoSugerido = "No se encontró la transferencia") {
  let motivo = null;
  if (aprobar) {
    if (!confirm(`¿Acreditar ${cantidad} chori${cantidad === 1 ? "" : "s"} a ${c.nombre}?`)) return;
  } else {
    motivo = prompt(`Motivo del rechazo para ${c.nombre} (lo va a ver):`, motivoSugerido);
    if (!motivo) return;
  }
  try {
    await api("/api/admin/resolver-comprobante", { id: c.id, aprobar, cantidad, motivo });
    avisar(aprobar ? `Aprobado: ${cantidad} chori${cantidad === 1 ? "" : "s"} para ${c.nombre}` : `Rechazado: ${c.nombre}`);
    $("lista-comprobantes").dataset.firma = "";
    await cargar();
  } catch (e) { avisar(e.message); }
}

async function cargarBloqueos() {
  const { bloqueos } = await api("/api/admin/bloqueos");
  $("bloqueos").classList.toggle("oculto", !bloqueos.length);
  const lista = $("lista-bloqueos");
  lista.innerHTML = "";
  for (const b of bloqueos) {
    const fila = document.createElement("div");
    fila.className = "bloqueo";
    const txt = document.createElement("div");
    const tit = document.createElement("div");
    tit.textContent = b.titulo;
    const det = document.createElement("div");
    det.className = "det";
    det.textContent = `${b.detalle} · faltan ${b.minutos} min`;
    txt.append(tit, det);
    const boton = document.createElement("button");
    boton.className = "primario";
    boton.textContent = "Desbloquear";
    boton.onclick = async () => {
      boton.disabled = true;
      try {
        await api("/api/admin/desbloquear", { clave: b.clave });
        avisar(`Desbloqueado: ${b.titulo}`);
        await cargarBloqueos();
      } catch (e) { boton.disabled = false; avisar(e.message); }
    };
    fila.append(txt, boton);
    lista.appendChild(fila);
  }
}

// Mientras el panel está abierto, refresca bloqueos, saldos y registro cada 30 s.
setInterval(() => {
  if (!$("v-panel").classList.contains("oculto") && $("f-persona").classList.contains("oculto")) cargar();
  if ($("registro").open) cargarRegistro();
  if ($("entregas").open) cargarEntregas();
  if ($("caja").open) cargarCaja();
}, 30000);

const pesos = (n) => (n < 0 ? "-$" : "$") + Math.abs(n).toLocaleString("es-AR");

async function subirTicket(id, archivo) {
  if (archivo.size > 8 * 1024 * 1024) throw new Error("El ticket supera los 8 MB.");
  const r = await fetch(`/api/admin/gastos/ticket?id=${encodeURIComponent(id)}`, { method: "POST", body: archivo });
  const res = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(res.error || "No se pudo subir el ticket."); e.estado = r.status; throw e; }
}

async function cargarCaja() {
  let datos;
  try {
    datos = await api("/api/admin/caja");
  } catch (e) {
    if (e.estado === 401) mostrar("pin"); else $("k-info").textContent = e.message;
    return;
  }
  $("k-recaudado").textContent = pesos(datos.recaudado);
  $("k-gastado").textContent = pesos(datos.gastado);
  $("k-saldo").textContent = pesos(datos.saldo);
  $("k-saldo-caja").className = datos.saldo < 0 ? "saldo-mal" : "saldo-ok";
  $("k-info").textContent = `Recaudado: ${datos.choris} chori${datos.choris === 1 ? "" : "s"} pagados por adelantado × ${pesos(datos.precio)}.`
    + (datos.gastos.length ? ` ${datos.gastos.length} gasto${datos.gastos.length === 1 ? "" : "s"} cargado${datos.gastos.length === 1 ? "" : "s"}.` : "");
  ultimaCaja = datos;
  pintarCosto();
  const lista = $("l-gastos");
  lista.innerHTML = "";
  if (!datos.gastos.length) lista.innerHTML = `<p class="info">Todavía no hay gastos cargados.</p>`;
  for (const g of datos.gastos) {
    const fila = document.createElement("div");
    fila.className = "ev";
    const arriba = document.createElement("div");
    arriba.className = "arriba";
    const fecha = document.createElement("span");
    fecha.textContent = g.fecha + (g.pagado_por ? ` · pagó ${g.pagado_por}` : "");
    const monto = document.createElement("span");
    monto.className = "monto";
    monto.textContent = pesos(g.monto);
    arriba.append(fecha, monto);
    const quien = document.createElement("div");
    quien.className = "quien";
    quien.textContent = g.descripcion;
    const ops = document.createElement("div");
    ops.className = "ops";
    if (g.tipo) {
      const ver = document.createElement("a");
      ver.href = `/api/admin/ticket/${g.id}`;
      ver.target = "_blank";
      ver.rel = "noopener";
      ver.textContent = g.tipo === "application/pdf" ? "Ver ticket (PDF)" : "Ver ticket";
      ops.appendChild(ver);
    }
    const adjuntar = document.createElement("button");
    adjuntar.className = "link";
    adjuntar.textContent = g.tipo ? "Cambiar ticket" : "Adjuntar ticket";
    adjuntar.onclick = () => { $("g-adjuntar").dataset.id = g.id; $("g-adjuntar").click(); };
    const borrar = document.createElement("button");
    borrar.className = "peligro";
    borrar.textContent = "Borrar";
    borrar.onclick = async () => {
      if (!confirm(`¿Borrar el gasto "${g.descripcion}" (${pesos(g.monto)})? No se puede deshacer.`)) return;
      try {
        await api("/api/admin/gastos/borrar", { id: g.id });
        avisar(`Gasto borrado: ${g.descripcion}`);
      } catch (e) { if (e.estado === 401) { mostrar("pin"); return; } alert(e.message); }
      cargarCaja();
    };
    ops.append(adjuntar, borrar);
    fila.append(arriba, quien, ops);
    lista.appendChild(fila);
  }
}

let ultimaCaja = null;

// Costo real por chori = gastos / choris vendidos. Cada persona "debería" pagar sus choris × costo real;
// se compara con lo que pagó de antemano.
function pintarCosto() {
  const datos = ultimaCaja;
  if (!datos) return;
  const base = datos.choris;
  const plural = (n, s) => `${n} ${s}${n === 1 ? "" : "s"}`;
  const lista = $("l-por-persona");
  lista.innerHTML = "";
  $("k-pp-info").textContent = "";
  if (!datos.gastado || !base) {
    $("k-costo").textContent = "-";
    $("k-costo-caja").className = "";
    $("k-costo-info").textContent = !datos.gastado ? "Cargue gastos para calcular el costo real." : "No hay choris vendidos.";
    return;
  }
  const costo = datos.gastado / base;
  const dif = datos.precio - costo;
  $("k-costo").textContent = pesos(Math.round(costo));
  $("k-costo-caja").className = dif >= 0 ? "saldo-ok" : "saldo-mal";
  $("k-costo-info").textContent = `${pesos(datos.gastado)} de gastos ÷ ${plural(base, "chori")}. `
    + (Math.round(dif) === 0 ? `Igual a los ${pesos(datos.precio)} que se cobraron.`
      : dif > 0 ? `Se cobraron ${pesos(datos.precio)}: sobran ${pesos(Math.round(dif))} por chori.`
      : `Se cobraron ${pesos(datos.precio)}: faltan ${pesos(Math.round(-dif))} por chori.`);
  const filas = personas
    .map((p) => ({ p, n: p.total }))
    .filter((f) => f.n > 0);
  let aDevolver = 0, aCobrar = 0;
  for (const { p, n } of filas) {
    const pago = p.total * datos.precio;
    const real = Math.round(n * costo);
    const diferencia = pago - real;
    if (diferencia > 0) aDevolver += diferencia; else aCobrar -= diferencia;
    const fila = document.createElement("div");
    fila.className = "ev";
    const arriba = document.createElement("div");
    arriba.className = "arriba";
    const det = document.createElement("span");
    det.textContent = `${plural(n, "chori")} · pagó ${pesos(pago)}`;
    const monto = document.createElement("span");
    monto.className = "monto";
    monto.textContent = pesos(real);
    arriba.append(det, monto);
    const quien = document.createElement("div");
    quien.className = "quien";
    quien.textContent = p.nombre;
    const res = document.createElement("div");
    res.className = "dif " + (diferencia >= 0 ? "bien" : "mal");
    res.textContent = diferencia === 0 ? "Pagó justo." : diferencia > 0 ? `Le sobran ${pesos(diferencia)}` : `Le faltan ${pesos(-diferencia)}`;
    fila.append(arriba, quien, res);
    lista.appendChild(fila);
  }
  $("k-pp-info").textContent = `${plural(filas.length, "persona")}. En total: devolver ${pesos(aDevolver)}`
    + (aCobrar ? `, cobrar ${pesos(aCobrar)}` : "") + ". La cifra de la derecha es lo que le habría correspondido pagar."
    + (datos.choris > personas.reduce((a, p) => a + p.total, 0)
      ? " Los choris donados que nadie tomó entran en el costo, pero no se le asignan a nadie." : "");
}


$("caja").addEventListener("toggle", () => { if ($("caja").open) cargarCaja(); });

$("f-gasto").onsubmit = async (ev) => {
  ev.preventDefault();
  $("e-gasto").textContent = "";
  const boton = $("b-gasto"); boton.disabled = true; boton.textContent = "Guardando…";

    }

  } finally { boton.disabled = false; boton.textContent = "Agregar gasto"; }

$("g-adjuntar").addEventListener("change", async () => {
  const entrada = $("g-adjuntar");
  const archivo = entrada.files[0];
  if (!archivo) return;
  try {
    await subirTicket(entrada.dataset.id, archivo);

  } catch (e) { if (e.estado === 401) { mostrar("pin"); return; } alert(e.message); }

  cargarCaja();
});

$("entregas").addEventListener("toggle", () => { if ($("entregas").open) cargarEntregas(); });
let tEntregas;
$("en-texto").addEventListener("input", () => { clearTimeout(tEntregas); tEntregas = setTimeout(cargarEntregas, 300); });

const EVENTOS = {
  LOGIN: "Ingreso", CAMBIO_CLAVE: "Cambio de contraseña", LOGIN_ASADOR: "PIN asador", LOGIN_ADMIN: "PIN admin",
  RESET_CLAVE_ADMIN: "Reseteo de contraseña (admin)", DESBLOQUEO_ADMIN: "Desbloqueo (admin)",
  REGISTRO: "Cuenta nueva", COMPROBANTE_SUBIDO: "Comprobante subido",
  COMPROBANTE_APROBADO: "Comprobante aprobado", COMPROBANTE_RECHAZADO: "Comprobante rechazado",
  GASTO_AGREGADO: "Gasto cargado (admin)", GASTO_BORRADO: "Gasto borrado (admin)", TICKET_GASTO: "Ticket de gasto (admin)",
};
const RESULTADOS = {
  ok: "correcto", ok_primer_ingreso: "primer ingreso", clave_incorrecta: "contraseña incorrecta",
  clave_inicial_incorrecta: "contraseña inicial incorrecta", dni_inexistente: "DNI no registrado",
  pin_incorrecto: "PIN incorrecto", bloqueado: "rechazado: estaba bloqueado",
  dni_existente: "rechazada: el DNI ya tenía cuenta", limite_ip: "rechazada: demasiadas cuentas desde esa IP",
  pendiente: "en revisión", rechazado: "rechazado",
  duplicado_propio: "rechazado: ya lo había enviado", duplicado_ajeno: "rechazado: otra cuenta ya envió ese archivo",
};

function textoResultado(ev) {
  if (ev.evento === "CAMBIO_CLAVE") return ev.detalle === "primera_vez=si" ? "creó su contraseña" : "cambió su contraseña";
  if (ev.evento === "DESBLOQUEO_ADMIN") return (ev.detalle || "").replace("bloqueo=", "liberó ");
  if (ev.evento.includes("GASTO")) return (ev.detalle || "").replaceAll("_", " ").replace("gasto=", "gasto #");
  if (!ev.resultado) return ev.detalle || "";
  const base = ev.resultado.replace("+bloqueo", "");
  let t = RESULTADOS[base] || base;
  if (ev.resultado.endsWith("+bloqueo")) t += " · bloqueó 15 min";
  return t;
}

async function cargarRegistro() {
  let datos;
  try {
    datos = await api("/api/admin/auditoria", { dni: $("r-dni").value, tipo: $("r-tipo").value });
  } catch (e) {
    if (e.estado === 401) mostrar("pin"); else $("r-info").textContent = e.message;
    return;
  }
  $("r-info").textContent = `${datos.eventos.length} de ${datos.total} eventos (los 200 más recientes).`;
  const lista = $("l-registro");
  lista.innerHTML = "";
  if (!datos.eventos.length) lista.innerHTML = `<p class="info">Sin eventos.</p>`;
  for (const ev of datos.eventos) {
    const fila = document.createElement("div");
    fila.className = "ev";
    const arriba = document.createElement("div");
    arriba.className = "arriba";
    const tipo = document.createElement("span");
    tipo.className = "tipo";
    tipo.textContent = EVENTOS[ev.evento] || ev.evento;
    const hora = document.createElement("span");
    hora.textContent = ev.hora;
    arriba.append(tipo, hora);
    fila.appendChild(arriba);
    if (ev.dni) {
      const quien = document.createElement("div");
      quien.className = "quien";
      quien.textContent = `${ev.nombre || "DNI no registrado"} · DNI ${formatoDni(ev.dni)}`;
      fila.appendChild(quien);
    }
    const res = document.createElement("div");
    const fallo = /incorrect|inexistente|bloque/.test(ev.resultado || "");
    res.className = "res " + (fallo ? "mal" : ev.resultado ? "bien" : "");
    res.textContent = `${textoResultado(ev)} · IP ${ev.ip}`;
    fila.appendChild(res);
    lista.appendChild(fila);
  }
}

$("registro").addEventListener("toggle", () => { if ($("registro").open) cargarRegistro(); });
let tRegistro;
$("r-dni").addEventListener("input", () => { clearTimeout(tRegistro); tRegistro = setTimeout(cargarRegistro, 300); });
$("r-tipo").addEventListener("change", cargarRegistro);
$("b-ver-registro").onclick = () => {
  $("r-dni").value = editando.dni || "";
  $("r-tipo").value = "todos";
  cerrarFormulario();
  $("registro").open = true;
  cargarRegistro();
  $("registro").scrollIntoView({ behavior: "smooth" });
};

function abrirFormulario(p) {
  editando = p;
  $("f-titulo").textContent = p ? "Editar persona" : "Nueva persona";
  $("f-nombre").value = p ? p.nombre : "";
  $("f-dni").value = p && p.dni ? p.dni : "";
  $("f-total").value = p ? p.total : 1;
  $("f-info").textContent = p
    ? `Retiró ${p.total - p.restantes} de ${p.total}. ${p.tiene_clave ? "Ya creó su contraseña." : "Todavía no ingresó."}`
    : "Sin DNI no puede entrar al portal, pero el asador lo encuentra buscando por nombre.";
  $("e-form").textContent = "";
  $("acciones-extra").classList.toggle("oculto", !p);
  $("b-reset").classList.toggle("oculto", !p || !p.tiene_clave);
  $("b-ver-registro").classList.toggle("oculto", !p || !p.dni);
  $("f-persona").classList.remove("oculto");
  window.scrollTo({ top: 0, behavior: "smooth" });
  (p && !p.dni ? $("f-dni") : $("f-nombre")).focus();
}

function cerrarFormulario() {
  editando = null;
  $("f-persona").classList.add("oculto");
}

$("f-persona").onsubmit = async (ev) => {
  ev.preventDefault();
  $("b-guardar").disabled = true;
  $("e-form").textContent = "";
  try {
    const datos = { nombre: $("f-nombre").value, dni: $("f-dni").value, total: $("f-total").value };
    if (editando) datos.id = editando.id;
    const { persona } = await api("/api/admin/guardar", datos);
    cerrarFormulario();
    avisar(`Guardado: ${persona.nombre} (${persona.restantes}/${persona.total})`);
    await cargar();
  } catch (e) {
    if (e.estado === 401) { mostrar("pin"); return; }
    $("e-form").textContent = e.message;
  } finally { $("b-guardar").disabled = false; }
};

$("b-cancelar").onclick = cerrarFormulario;
$("b-nueva").onclick = () => abrirFormulario(null);

$("b-reset").onclick = async () => {
  if (!confirm(`¿Resetear la contraseña de ${editando.nombre}? Va a poder entrar de nuevo con su DNI.`)) return;
  try {
    await api("/api/admin/reset-clave", { id: editando.id });
    avisar(`Contraseña reseteada: ${editando.nombre}`);
    cerrarFormulario();
    await cargar();
  } catch (e) { $("e-form").textContent = e.message; }
};

$("b-borrar").onclick = async () => {
  if (!confirm(`¿Borrar a ${editando.nombre}? No se puede deshacer.`)) return;
  try {
    await api("/api/admin/borrar", { id: editando.id });
    avisar(`Borrado: ${editando.nombre}`);
    cerrarFormulario();
    await cargar();
  } catch (e) { $("e-form").textContent = e.message; }
};

$("buscar").addEventListener("input", pintar);
$("solo-sin-dni").addEventListener("change", pintar);

$("f-pin").onsubmit = async (ev) => {
  ev.preventDefault();
  $("e-pin").textContent = "";
  try {
    await api("/api/admin/login", { pin: $("pin").value });
    $("pin").value = "";
    await cargar();
  } catch (e) { $("e-pin").textContent = e.message; }
};

$("b-salir").onclick = async () => {
  await api("/api/logout").catch(() => {});
  mostrar("pin");
};

cargar();
